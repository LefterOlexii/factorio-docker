version: '2'
services:
  factorio:
    build:
      context: .
      args:
        # Check buildinfo.json for supported versions and SHAs
        # https://github.com/factoriotools/factorio-docker/blob/master/buildinfo.json
        - VERSION=2.0.41
        - SHA256=77ebccae8167fc1a9fc4da8c11e8410f6017b92b1a0913eb58ac5285c9eec399
    ports:
      - "34197:34197/udp"
      - "27015:27015/tcp"
    volumes:
      - /opt/factorio:/factorio
    environment:
      #      - PUID=1000
      #      - PGID=1000
      - LOAD_LATEST_SAVE=true
      - GENERATE_NEW_SAVE=true
      - SAVE_NAME=111
      - UPDATE_MODS_ON_START=true
      - USERNAME=Inger_Pro
      - TOKEN=ba4cce47d034c8b0e36b4cf9a2c5ec
      - DLC_SPACE_AGE=false
      #      - PORT=34198
      #      - PRESET=deathworld
      #      - ADDR=::1
#    # Uncomment the following line to enable the use of the host's network stack,
#    # which may be necessary for some setups like NAS or when using some proxy service like firewall rules.
#    extra_hosts:
#      - "host.docker.internal:host-gateway"
